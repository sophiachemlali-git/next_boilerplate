version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '04:00'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'npm'
    versioning-strategy: 'increase-if-necessary'
    commit-message:
      prefix: 'chore'
      include: 'scope'
